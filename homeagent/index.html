<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Agent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0e1116; --panel:#151a22; --panel2:#1b2230; --line:#242c3a;
  --text:#e6ebf2; --dim:#8b96a8; --accent:#5b8cff; --accent2:#7aa2ff;
  --user:#22304b; --ok:#3fbf7f; --err:#e05c5c; --mono:ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:grid; grid-template-columns:280px 1fr; grid-template-rows:auto 1fr auto;
  height:100vh; overflow:hidden;
}
/* ---------- sidebar ---------- */
aside{grid-row:2; background:var(--panel); border-right:1px solid var(--line);
  display:flex; flex-direction:column; min-height:0}
.brand{display:flex; align-items:center; gap:10px; padding:16px 16px 12px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#3b5fd9);
  display:grid;place-items:center;font-size:16px}
.brand b{font-size:15px}
.brand small{display:block;color:var(--dim);font-size:11px}
.newbtn{margin:4px 12px 12px;padding:9px 12px;border:0;border-radius:9px;cursor:pointer;
  background:var(--accent);color:#fff;font-weight:600;font-size:13px;display:flex;gap:8px;align-items:center;justify-content:center}
.newbtn:hover{background:var(--accent2)}
.chats{flex:1;overflow-y:auto;padding:2px 8px 8px}
.chats .hd{padding:10px 10px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.chip{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;
  color:var(--dim);font-size:13px;position:relative}
.chip:hover{background:var(--panel2);color:var(--text)}
.chip.active{background:var(--panel2);color:var(--text);box-shadow:inset 2px 0 0 var(--accent)}
.chip .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .x{opacity:0;border:0;background:none;color:var(--dim);cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px}
.chip:hover .x{opacity:1}
.chip .x:hover{color:var(--err);background:rgba(224,92,92,.12)}
.chip .n{font-size:11px;color:var(--dim)}
.sbfoot{padding:12px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--dim);
  display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--err);flex:none}
.dot.ok{background:var(--ok)}
/* ---------- header ---------- */
header{grid-column:1/3;grid-row:1;display:flex;align-items:center;gap:14px;
  padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modelsel{display:flex;align-items:center;gap:8px}
.modelsel label{color:var(--dim);font-size:12px}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;
  padding:6px 10px;font-size:13px;max-width:260px;cursor:pointer}
select:focus{outline:none;border-color:var(--accent)}
.btnghost{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
  padding:6px 12px;font-size:12.5px;cursor:pointer}
.btnghost:hover{color:var(--text);border-color:var(--dim)}
/* ---------- main ---------- */
main{grid-row:2;display:flex;flex-direction:column;min-height:0;min-width:0}
#feed{flex:1;overflow-y:auto;padding:22px 0 12px;scroll-behavior:smooth}
.inner{max-width:860px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:18px}
.msg{display:flex;gap:12px;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.avatar{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;
  font-size:14px;font-weight:700;margin-top:2px}
.msg.user .avatar{background:var(--user);color:#bcd0ff}
.msg.assistant .avatar{background:linear-gradient(135deg,var(--accent),#3b5fd9);color:#fff}
.bubble{min-width:0;flex:1;display:flex;flex-direction:column;gap:6px}
.meta{font-size:11.5px;color:var(--dim);display:flex;gap:8px;align-items:baseline}
.meta .t{margin-left:auto}
.msg.user .meta{flex-direction:row-reverse}
.msg.user .meta .t{margin:0}
body .msg.user .meta{justify-content:flex-end}
.content{white-space:pre-wrap;word-wrap:break-word}
.msg.user .content{background:var(--user);padding:10px 14px;border-radius:4px 14px 14px 14px;
  max-width:100%}
.msg.assistant .content{color:var(--text)}
.content .cursor{display:inline-block;width:8px;height:15px;background:var(--accent);
  vertical-align:-2px;animation:blink 1s steps(2) infinite;border-radius:2px}
@keyframes blink{50%{opacity:0}}
/* markdown bits */
.content p{margin:.45em 0}
.content pre{background:#0b0e13;border:1px solid var(--line);border-radius:10px;padding:12px 14px;
  overflow-x:auto;font-family:var(--mono);font-size:13px;line-height:1.5;margin:.6em 0;position:relative}
.content pre .copy{position:absolute;top:8px;right:8px;border:0;background:var(--panel2);color:var(--dim);
  border-radius:6px;font-size:11px;padding:3px 8px;cursor:pointer;opacity:0;transition:.15s}
.content pre:hover .copy{opacity:1}
.content pre .copy:hover{color:var(--text)}
.content code{font-family:var(--mono);font-size:.92em;background:#0b0e13;padding:.12em .38em;
  border-radius:5px;border:1px solid var(--line)}
.content pre code{background:none;border:0;padding:0}
.content ul,.content ol{margin:.45em 0;padding-left:1.4em}
.content table{border-collapse:collapse;margin:.6em 0;display:block;overflow-x:auto;max-width:100%}
.content th,.content td{border:1px solid var(--line);padding:6px 11px;font-size:13px;text-align:left}
.content th{background:var(--panel2);font-weight:600}
.content h1,.content h2,.content h3{margin:.7em 0 .35em;line-height:1.3}
.content a{color:var(--accent2)}
.content img{max-width:100%;border-radius:8px}
.shimmer{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--panel2) 25%,var(--panel) 50%,var(--panel2) 75%);
  background-size:200% 100%;animation:sh 1.2s infinite;margin:6px 0;max-width:280px}
@keyframes sh{to{background-position:-200% 0}}
.empty{margin:auto;text-align:center;color:var(--dim);display:flex;flex-direction:column;gap:10px;padding:30px}
.empty .big{font-size:44px}
.empty kbd{background:var(--panel2);border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px}
/* ---------- composer ---------- */
footer{grid-column:1/3;grid-row:3;background:var(--panel);border-top:1px solid var(--line);padding:12px 18px 14px}
.comp{max-width:860px;margin:0 auto}
.prevrow{display:none;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.prevrow.on{display:flex}
.prev{position:relative}
.prev img{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.prev .rm{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;border:0;
  background:var(--err);color:#fff;font-size:11px;cursor:pointer;line-height:1}
.inputrow{display:flex;gap:10px;align-items:flex-end;background:var(--panel2);
  border:1px solid var(--line);border-radius:13px;padding:8px 8px 8px 12px;transition:border-color .15s}
.inputrow:focus-within{border-color:var(--accent)}
textarea{flex:1;background:none;border:0;outline:none;resize:none;color:var(--text);
  font:inherit;line-height:1.5;max-height:260px;min-height:24px;padding:2px 0}
textarea::placeholder{color:var(--dim)}
.tools{display:flex;gap:4px;align-items:center}
.iconbtn{border:0;background:none;color:var(--dim);width:34px;height:34px;border-radius:8px;
  cursor:pointer;font-size:17px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--line);color:var(--text)}
.send{border:0;background:var(--accent);color:#fff;width:34px;height:34px;border-radius:9px;
  cursor:pointer;font-size:15px;display:grid;place-items:center;flex:none}
.send:hover{background:var(--accent2)}
.send:disabled{background:var(--line);color:var(--dim);cursor:default}
.stop{background:var(--err)}
.hint{max-width:860px;margin:7px auto 0;font-size:11.5px;color:var(--dim);display:flex;justify-content:space-between}
.hint .err{color:var(--err)}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>

<header>
  <h1 id="chatTitle">Home Agent</h1>
  <div class="modelsel">
    <label for="model">Model</label>
    <select id="model"></select>
    <button class="btnghost" id="refreshModels" title="Re-check models with Ollama">↻ models</button>
  </div>
</header>

<aside>
  <div class="brand">
    <div class="logo">🏠</div>
    <div><b>Home Agent</b><small id="ollamaHost">local · ollama</small></div>
  </div>
  <button class="newbtn" id="newChat">＋ New chat</button>
  <div class="chats">
    <div class="hd">History</div>
    <div id="chatList"></div>
  </div>
  <div class="sbfoot"><span class="dot" id="ollamaDot"></span><span id="ollamaState">checking Ollama…</span></div>
</aside>

<main>
  <div id="feed"><div class="inner" id="inner"></div></div>
</main>

<footer>
  <div class="comp">
    <div class="prevrow" id="prevRow"></div>
    <div class="inputrow">
      <textarea id="input" rows="1" placeholder="Message Home Agent…  (Enter to send · Shift+Enter for newline)"></textarea>
      <div class="tools">
        <button class="iconbtn" id="attachBtn" title="Attach image">🖼</button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <button class="send" id="sendBtn" title="Send">➤</button>
      </div>
    </div>
    <div class="hint">
      <span id="statusLine"></span>
      <span>qwen3.8 default · any ollama model · images on vision models</span>
    </div>
  </div>
</footer>

<script>
"use strict";
const $ = id => document.getElementById(id);
const feed = $("feed"), inner = $("inner"), input = $("input"),
      modelSel = $("model"), prevRow = $("prevRow"), fileIn = $("file");
let chats = [], current = null, modelDefault = "", pendingImages = [],
    busy = false, controller = null;

/* ---------------- utils ---------------- */
const esc = s => s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => new Date().toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
const atBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 90;

function inline(s){
  s = s.replace(/`([^`\n]+)`/g, (m,c)=>"\u0001I"+c+"\u0001");
  s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[\s(])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\u0001I([^\u0001]*)\u0001/g, "<code>$1</code>");
  return s;
}
function asciiTables(s){
  // turn fenced "tables" of +- | chars into real html tables
  const rows = s.split("\n").map(r => r.trim()).filter(r => r.length);
  const isBorder = r => /^[\s|+\-=_]+$/.test(r) && (r.includes("-") || r.includes("="));
  if (!rows.length || !rows.some(isBorder) || !rows.some(r=>r.includes("|"))) return s;
  const body = rows.filter(r=>!isBorder(r));
  if (!body.length) return s;
  const split = r => r.replace(/^\s*\|/,"").replace(/\|\s*$/,"").split("|").map(c=>c.trim());
  let maxc = Math.max(...body.map(r=>split(r).length));
  if (maxc < 2 || !rows.every(r=>isBorder(r)||split(r).length===maxc)) return s;
  const head = split(body[0]);
  let html = "<table><thead><tr>" + head.map(h=>"<th>"+esc(h)+"</th>").join("") + "</tr></thead><tbody>";
  for (const r of body.slice(1)) html += "<tr>"+split(r).map(c=>"<td>"+esc(c)+"</td>").join("")+"</tr>";
  return html + "</tbody></table>";
}
function renderMarkdown(raw){
  let s = esc(raw);
  // 1) extract fenced code blocks so inner rules don't touch them
  const blocks = [];
  s = s.replace(/```([\w+#-]*)\n?([\s\S]*?)```/g, (m,lang,code)=>{
    blocks.push({code: code.replace(/\n$/,"")});
    return "\u0002B"+(blocks.length-1)+"\u0002";
  });
  // 2) headers
  s = s.replace(/^###\s+(.*)$/gm, "<h3>$1</h3>")
       .replace(/^##\s+(.*)$/gm, "<h2>$1</h2>")
       .replace(/^#\s+(.*)$/gm, "<h1>$1</h1>");
  // 3) unordered / ordered lists
  s = s.replace(/((?:^\s*[-*]\s+[^\n]+\n?)+)/gm, m =>
      "<ul>" + m.trim().split("\n").map(l=>"<li>"+inline(l.replace(/^\s*[-*]\s+/,""))+"</li>").join("") + "</ul>");
  s = s.replace(/((?:^\s*\d+\.\s+[^\n]+\n?)+)/gm, m =>
      "<ol>" + m.trim().split("\n").map(l=>"<li>"+inline(l.replace(/^\s*\d+\.\s+/,""))+"</li>").join("") + "</ol>");
  // 4) paragraphs (keep already-tagged chunks as-is)
  s = s.split(/\n{2,}/).map(chunk => {
    const t = chunk.trim();
    if (!t) return "";
    if (/^<(h\d|ul|ol|pre|table|code|blockquote|img)/.test(t)) return t;
    return "<p>" + t.replace(/\n/g,"<br>") + "</p>";
  }).join("\n");
  // 5) ascii tables: if a paragraph is a boxed ascii table, upgrade it
  s = s.replace(/<p>([\s\S]*?)<\/p>/g, (m, body) => {
    const plain = body.replace(/<br>/g,"\n").replace(/<[^>]+>/g,"");
    const upgraded = asciiTables(plain);
    return /^<table>/.test(upgraded) ? upgraded : m;
  });
  // 6) restore code blocks
  s = s.replace(/\u0002B(\d+)\u0002/g, (m,i)=>
      "<pre><button class='copy'>copy</button><code>" + esc(blocks[+i].code) + "</code></pre>");
  return s;
}

/* ---------------- rendering ---------------- */
function msgNode(role, content, opts={}){
  const el = document.createElement("div");
  el.className = "msg " + role;
  const avatar = role === "user" ? "You" : "🏠";
  const imgs = (opts.images||[]).map(u =>
    `<img src="${u}" alt="attachment" style="max-width:220px;border-radius:8px;margin-top:6px;display:block">`).join("");
  el.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="bubble">
      <div class="meta"><span>${role==="user"?"You":"Home Agent"}${opts.model?` · ${esc(opts.model)}`:""}${opts.ms?` · ${(opts.ms/1000).toFixed(1)}s`:""}</span><span class="t">${esc(now())}</span></div>
      <div class="content">${role==="user" ? esc(content) + imgs : ""}</div>
    </div>`;
  return el;
}
function addMessage(role, content, opts={}){
  const stick = atBottom();
  const node = msgNode(role, content, opts);
  inner.appendChild(node);
  if (stick) feed.scrollTop = feed.scrollHeight;
  return node;
}
function emptyState(){
  if (inner.children.length) return;
  const d = document.createElement("div");
  d.className = "empty"; d.id = "empty";
  d.innerHTML = `<div class="big">🏠</div>
    <b style="color:var(--text)">Home Agent</b>
    <span>Local chat with your Ollama models — <b style="color:var(--text)">${esc(modelDefault||"qwen3.8:27b")}</b> by default.</span>
    <span>Try asking it to write a Python script, explain an error, or <i>attach a screenshot</i>.</span>
    <span><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline · <kbd>🖼</kbd> image</span>`;
  feed.prepend(d);
}
function clearEmpty(){ const e = $("empty"); if (e) e.remove(); }

/* ---------------- sidebar ---------------- */
function renderChats(){
  const list = $("chatList"); list.innerHTML = "";
  chats.forEach(c => {
    const chip = document.createElement("div");
    chip.className = "chip" + (current && current.id === c.id ? " active" : "");
    chip.innerHTML = `<span class="t">${esc(c.title)}</span><span class="n">${c.n||0}</span><button class="x" title="Delete">✕</button>`;
    chip.onclick = e => { if (e.target.classList.contains("x")) return deleteChat(c.id); openChat(c.id); };
    list.appendChild(chip);
  });
  if (!chats.length) list.innerHTML = `<div style="padding:10px 12px;font-size:12px;color:var(--dim)">No chats yet</div>`;
}
async function loadChats(){
  const r = await fetch("/api/chats").then(x=>x.json());
  chats = r.chats; modelDefault = r.default_model;
  renderChats();
}
async function deleteChat(id){
  if (!confirm("Delete this chat and its messages?")) return;
  await fetch("/api/chats/"+id, {method:"DELETE"});
  if (current && current.id === id) current = null;
  await loadChats();
  if (!current) newChatLocal();
}
async function newChat(){
  await newChatLocal();
  input.focus();
}
async function newChatLocal(){
  const r = await fetch("/api/chats", {method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({model: modelSel.value})}).then(x=>x.json());
  current = r.chat;
  await loadChats();
  inner.innerHTML = ""; emptyState();
  $("chatTitle").textContent = "New chat";
}
async function openChat(id){
  const r = await fetch("/api/chats/"+id).then(x=>x.json());
  current = r.chat;
  modelSel.value = r.chat.model;
  inner.innerHTML = "";
  r.messages.forEach(m => {
    if (m.role === "user") addMessage("user", m.content, {images: JSON.parse(m.images||"[]")});
    else addMessage("assistant", m.content, {model:m.model, ms:m.response_ms});
  });
  if (!r.messages.length) emptyState();
  $("chatTitle").textContent = r.chat.title;
  feed.scrollTop = feed.scrollHeight;
  renderChats();
  input.focus();
}

/* ---------------- models ---------------- */
async function loadModels(){
  try {
    const r = await fetch("/api/models").then(async x => ({ok:x.ok, data:await x.json()}));
    const d = r.data;
    if (d.models) modelDefault = d.default;
    const models = d.models && d.models.length ? d.models : (modelDefault ? [modelDefault] : []);
    modelSel.innerHTML = "";
    models.forEach(m => {
      const o = document.createElement("option");
      o.value = m; o.textContent = m;
      if (m === (current && current.model) || m === modelDefault) o.selected = true;
      modelSel.appendChild(o);
    });
    if (current) modelSel.value = current.model;
    $("ollamaDot").classList.toggle("ok", !!r.data.models);
    $("ollamaState").textContent = r.data.models ? "Ollama online" : "Ollama offline";
    $("ollamaHost").textContent = "local · " + (d.ollama || "ollama");
  } catch {
    $("ollamaDot").classList.remove("ok");
    $("ollamaState").textContent = "Ollama offline";
  }
  if (modelDefault && !modelSel.value) modelSel.value = modelDefault;
}

/* ---------------- images ---------------- */
function renderPrev(){
  prevRow.classList.toggle("on", pendingImages.length>0);
  prevRow.innerHTML = "";
  pendingImages.forEach((u,i) => {
    const d = document.createElement("div"); d.className="prev";
    d.innerHTML = `<img src="${u}"><button class="rm">✕</button>`;
    d.querySelector(".rm").onclick = () => { pendingImages.splice(i,1); renderPrev(); };
    prevRow.appendChild(d);
  });
}
async function attach(files){
  for (const f of files){
    const fd = new FormData(); fd.append("file", f);
    const r = await fetch("/api/upload", {method:"POST", body:fd});
    const d = await r.json();
    if (!r.ok) { flash(d.error || "upload failed"); continue; }
    pendingImages.push(d.url);
  }
  fileIn.value = ""; renderPrev();
}

/* ---------------- send ---------------- */
function flash(msg, ok=false){
  $("statusLine").textContent = msg;
  $("statusLine").className = ok ? "" : "err";
  setTimeout(()=>{ $("statusLine").textContent=""; }, 6000);
}
async function send(){
  if (busy) return;
  const text = input.value.trim();
  if (!text && !pendingImages.length) return;
  if (!current) await newChatLocal();
  clearEmpty();
  input.value = ""; autosize();
  addMessage("user", text || "(image)", {images: pendingImages});
  const images = pendingImages; pendingImages = []; renderPrev();

  busy = true; setSend(false);
  const stickEl = (() => { const stick = atBottom();
    const n = document.createElement("div"); n.className="msg assistant";
    n.innerHTML = `<div class="avatar">🏠</div><div class="bubble"><div class="meta"><span>Home Agent · ${esc(modelSel.value)}</span><span class="t">…</span></div>
      <div class="content"><div class="shimmer"></div></div></div>`;
    inner.appendChild(n); if (stick) feed.scrollTop = feed.scrollHeight; return n; })();
  const contentEl = stickEl.querySelector(".content");
  const metaEl = stickEl.querySelector(".meta");

  const t0 = performance.now();
  controller = new AbortController();
  let acc = "";
  try {
    const resp = await fetch(`/api/chats/${current.id}/messages`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({text, images}), signal: controller.signal,
    });
    if (!resp.ok) throw new Error((await resp.json()).error || resp.statusText);
    const reader = resp.body.getReader();
    const dec = new TextDecoder(); let buf = "";
    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      let i;
      while ((i = buf.indexOf("\n")) >= 0){
        const line = buf.slice(0,i).trim(); buf = buf.slice(i+1);
        if (!line) continue;
        const ev = JSON.parse(line);
        if (ev.type === "delta"){ acc += ev.content;
          contentEl.innerHTML = renderMarkdown(acc) + `<span class="cursor"></span>`;
          if (atBottom()) feed.scrollTop = feed.scrollHeight;
        } else if (ev.type === "error"){
          contentEl.insertAdjacentHTML("beforeend", `<p style="color:var(--err)">⚠ ${esc(ev.error)}</p>`);
        }
      }
    }
    contentEl.innerHTML = renderMarkdown(acc) || `<i style="color:var(--dim)">(no response)</i>`;
    const ms = Math.round(performance.now() - t0);
    metaEl.innerHTML = `<span>Home Agent · ${esc(modelSel.value)} · ${(ms/1000).toFixed(1)}s</span><span class="t">${esc(now())}</span>`;
    bindCopy(contentEl);
    loadChats(); // refresh titles/counts
  } catch (e){
    if (e.name !== "AbortError") contentEl.innerHTML = `<span style="color:var(--err)">⚠ ${esc(e.message)}</span>`;
    if (e.name === "AbortError") flash("Stopped.");
  } finally {
    busy = false; setSend(true); controller = null;
    feed.scrollTop = feed.scrollHeight;
  }
}
function setSend(on){
  const b = $("sendBtn");
  if (on){ b.className="send"; b.textContent="➤"; b.disabled = !(input.value.trim()||pendingImages.length); b.title="Send"; }
  else { b.className="send stop"; b.textContent="■"; b.disabled=false; b.title="Stop"; }
}
function bindCopy(scope){
  scope.querySelectorAll("pre .copy").forEach(btn => {
    btn.onclick = () => {
      navigator.clipboard.writeText(btn.parentElement.querySelector("code").innerText);
      btn.textContent = "copied ✓"; setTimeout(()=>btn.textContent="copy", 1200);
    };
  });
}

/* ---------------- events ---------------- */
function autosize(){ input.style.height="auto"; input.style.height = Math.min(input.scrollHeight, 260)+"px"; }
input.addEventListener("input", ()=>{ autosize(); setSend(!busy); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});
$("sendBtn").onclick = () => { busy ? controller && controller.abort() : send(); };
$("newChat").onclick = newChat;
$("attachBtn").onclick = () => fileIn.click();
fileIn.onchange = () => fileIn.files.length && attach([...fileIn.files]);
$("refreshModels").onclick = loadModels;
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => {
  e.preventDefault();
  if ([...e.dataTransfer.files].some(f=>f.type.startsWith("image/")))
    attach([...e.dataTransfer.files].filter(f=>f.type.startsWith("image/")));
});

/* ---------------- init ---------------- */
(async () => {
  await loadModels();
  await loadChats();
  if (chats.length){ await openChat(chats[0].id); } else { await newChatLocal(); }
  setSend(false); input.focus();
})();
</script>
</body>
