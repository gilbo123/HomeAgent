<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- ===== header: current chat title + model picker ===== -->
    <header>
        <h1 id="chatTitle">Home Agent</h1>
        <div class="modelsel">
            <label for="model">Model</label>
            <select id="model"></select>
            <button class="btnghost" id="refreshModels" title="Re-check models with Ollama">↻ models</button>
        </div>
    </header>

    <!-- ===== sidebar: brand, new-chat, history ===== -->
    <aside>
        <div class="brand">
            <div class="logo">🏠</div>
            <div>
                <b>Home Agent</b>
                <small id="ollamaHost">local · ollama</small>
            </div>
        </div>

        <button class="newbtn" id="newChat">＋ New chat</button>

        <div class="chats">
            <div class="hd">History</div>
            <div id="chatList"></div>
        </div>

        <div class="sbfoot">
            <span class="dot" id="ollamaDot"></span>
            <span id="ollamaState">checking Ollama…</span>
        </div>
    </aside>

    <!-- ===== main: the only scrolling region ===== -->
    <main>
        <div id="feed">
            <div class="inner" id="inner"></div>
        </div>
    </main>

    <!-- ===== composer: previews, input, tools ===== -->
    <footer>
        <div class="comp">
            <div class="prevrow" id="prevRow"></div>
            <div class="composerrow">
                <button class="attachbtn" id="attachBtn" title="Attach image">🖼 Attach image</button>
                <input type="file" id="file" accept="image/*" multiple hidden>
                <div class="inputrow">
                    <textarea id="input" rows="1"
                              placeholder="Message Home Agent…  (Enter to send · Shift+Enter for newline)"></textarea>
                    <div class="tools">
                        <button class="send" id="sendBtn" title="Send">➤</button>
                    </div>
                </div>
            </div>
            <div class="hint">
                <span id="statusLine"></span>
                <span>qwen3.8 default · any ollama model · images on vision models</span>
            </div>
        </div>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
