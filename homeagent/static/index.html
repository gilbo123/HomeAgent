<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home Agent</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <!-- ===== header: menu (mobile), current chat title ===== -->
    <header>
        <button id="menuBtn" class="iconbtn" aria-label="Menu" title="Menu">☰</button>
        <h1 id="chatTitle">Home Agent</h1>
    </header>

    <!-- ===== sidebar: brand, model picker, new-chat, history ===== -->
    <aside>
        <div class="brand">
            <div class="logo">🏠</div>
            <div>
                <b>Home Agent</b>
                <small id="ollamaHost">Ollama server</small>
            </div>
        </div>

        <div class="modelsel">
            <label for="model">Model</label>
            <select id="model"></select>
            <button class="btnghost" id="refreshModels" title="Re-check models with Ollama">↻</button>
        </div>

        <button class="newbtn" id="newChat">＋ New chat</button>

        <div id="incogBanner" class="incogbanner" hidden>🕶 <span>Incognito — this chat isn’t saved</span></div>

        <div class="chats" id="chatsWrap">
            <div class="hd">History</div>
            <div id="chatList"></div>
        </div>

        <button class="incogbtn" id="incognitoToggle" aria-pressed="false"
                title="Incognito — context is kept in memory for this chat, but nothing is saved (no history, no database)">
            🕶 <span>Incognito</span>
        </button>

        <div class="sbfoot">
            <span class="dot" id="ollamaDot"></span>
            <span id="ollamaState">checking Ollama…</span>
        </div>
    </aside>

    <!-- ===== main: the only scrolling region ===== -->
    <main>
        <div id="feed">
            <div class="inner" id="inner"></div>
        </div>
    </main>

    <!-- ===== mobile nav scrim ===== -->
    <div class="scrim" id="scrim" hidden></div>

    <!-- ===== composer: previews, input, tools ===== -->
    <footer>
        <div class="comp">
            <div class="prevrow" id="prevRow"></div>
            <div class="composerrow">
                <button class="attachbtn" id="attachBtn" title="Attach image">🖼 Attach image</button>
                <input type="file" id="file" accept="image/*" multiple hidden>
                <div class="inputrow">
                    <textarea id="input" rows="1"
                              placeholder="Message Home Agent…  (Enter to send · Shift+Enter for newline)"></textarea>
                    <div class="tools">
                        <button class="send" id="sendBtn" title="Send">➤</button>
                    </div>
                </div>
            </div>
            <div class="hint">
                <span id="statusLine"></span>
                <span>select model from dropdown and start chatting</span>
            </div>
        </div>
    </footer>

    <script src="/app.js"></script>
</body>
</html>
